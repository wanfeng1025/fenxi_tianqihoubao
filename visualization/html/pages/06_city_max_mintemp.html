<!doctype html>

  <script>
    const chart=echarts.init(document.getElementById('chart'),null,{renderer:'canvas',devicePixelRatio:1});
    const option={"animation":false,"backgroundColor":"#FFFFFF","color":["#2F5597","#70AD47","#ED7D31","#5B9BD5","#A5A5A5","#FFC000"],"textStyle":{"fontFamily":"Microsoft YaHei, SimSun, Times New Roman","color":"#222"},"title":{"text":"各城市历史最高气温与最低气温","subtext":"统计范围：history_weather，2020-01-01 至 2026-09-02","left":"center","top":18,"textStyle":{"fontSize":28,"fontWeight":"bold","color":"#17365D"},"subtextStyle":{"fontSize":15,"color":"#666","lineHeight":22}},"tooltip":{"trigger":"axis","confine":true},"legend":{"top":94,"left":"center","textStyle":{"fontSize":15}},"grid":{"left":92,"right":72,"top":145,"bottom":78,"containLabel":true},"xAxis":{"type":"category","data":["亳州","南京","合肥","杭州","淮南","铜陵"],"axisLabel":{"fontSize":17}},"yAxis":{"type":"value","name":"温度（℃）","axisLabel":{"formatter":"{value}℃","fontSize":14},"splitLine":{"lineStyle":{"type":"dashed"}}},"series":[{"name":"最高气温","type":"bar","barMaxWidth":48,"data":[40,40,40,42,39,39],"label":{"show":true,"position":"top","formatter":"{c}℃"}},{"name":"最低气温","type":"bar","barMaxWidth":48,"data":[-10,-7,-9,-5,-9,-7],"label":{"show":true,"position":"bottom","formatter":"{c}℃"}}]};
